<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A0A0B">
<meta name="apple-mobile-web-app-title" content="Forja">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<title>Forja</title>
<style>
:root{--bg:#0A0A0B;--card:#141416;--card2:#1D1D20;--line:#26262A;--tx:#F5F5F6;--mut:#8C8C93;--dim:#5C5C63;--acc:#D4FF3A;--ink:#0A0A0B;--c2:#5AC8FA;--c3:#FF8A4C;--gold:#FFD60A;--red:#FF5A4F;--r:22px;--st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;-webkit-user-select:none;user-select:none}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit;font-size:16px;color:var(--tx);-webkit-user-select:text;user-select:text}
.num{font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
#app{max-width:540px;margin:0 auto;padding:calc(var(--st) + 16px) 16px calc(var(--sb) + 104px)}
.top{display:flex;align-items:flex-end;justify-content:space-between;margin:4px 2px 18px;gap:12px}
.eyebrow{color:var(--mut);font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em}
h1{font-size:34px;line-height:1.05;margin:4px 0 0;font-weight:800;letter-spacing:-.035em}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
.ct{font-size:12.5px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.07em}
.mut{color:var(--mut)}.sm{font-size:13px}.xs{font-size:11.5px}.b{font-weight:700}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:54px;border-radius:17px;background:var(--acc);color:var(--ink);font-weight:700;font-size:16.5px;width:100%;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.btn.ghost{background:transparent;color:var(--mut);height:46px;font-weight:600}
.btn.danger{background:rgba(255,90,79,.12);color:var(--red)}
.btn.s{height:38px;font-size:14px;border-radius:12px;width:auto;padding:0 14px}
.btn[disabled]{opacity:.4}
.pill{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 11px;border-radius:99px;background:var(--card2);font-size:12.5px;font-weight:700;color:var(--mut);white-space:nowrap}
.pill.acc{background:rgba(212,255,58,.13);color:var(--acc)}
.pill.gold{background:rgba(255,214,10,.13);color:var(--gold)}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--card2);color:var(--mut)}
/* tabbar */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20}
#tabbar .in{background:rgba(12,12,13,.84);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);border-top:1px solid var(--line);padding:8px 8px calc(var(--sb) + 6px)}
#tabbar .g{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--dim);padding:3px 0;position:relative;text-align:center}
.tab svg{width:25px;height:25px}
.tab.on{color:var(--acc)}
.tab .dot{position:absolute;top:2px;left:calc(50% + 9px);width:8px;height:8px;border-radius:9px;background:var(--c3)}
/* sheets */
.sw{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:flex-end}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.62)}
.sheet{position:relative;background:#0E0E10;border-top-left-radius:28px;border-top-right-radius:28px;max-height:92vh;max-height:92dvh;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:10px 18px calc(var(--sb) + 22px);border-top:1px solid var(--line);max-width:540px;width:100%;margin:0 auto}
.sheet.full{height:100%;max-height:none;border-radius:0;padding:calc(var(--st) + 10px) 16px calc(var(--sb) + 120px);border:0;background:var(--bg)}
.grab{width:38px;height:5px;border-radius:9px;background:#333338;margin:0 auto 16px}
.enter .sheet{animation:up .34s cubic-bezier(.2,.9,.25,1)}.enter .scrim{animation:fade .25s}
@keyframes up{from{transform:translateY(100%)}}@keyframes fade{from{opacity:0}}
.sh-t{font-size:24px;font-weight:800;letter-spacing:-.03em;margin:0 0 4px}
/* fields */
.field{display:block;margin-bottom:14px}
.lbl{display:block;font-size:11.5px;font-weight:700;color:var(--mut);margin:0 0 7px 4px;text-transform:uppercase;letter-spacing:.07em}
.inp{width:100%;height:50px;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:0 14px;outline:none;-webkit-appearance:none;appearance:none}
.inp:focus{border-color:var(--acc)}
textarea.inp{height:110px;padding:12px 14px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
select.inp{background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 20px) 22px,calc(100% - 15px) 22px;background-size:5px 5px;background-repeat:no-repeat}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;height:40px;border-radius:10px;font-weight:700;color:var(--mut);font-size:14px;text-align:center}
.seg button.on{background:var(--tx);color:var(--bg)}
.seg.mini{padding:3px;border-radius:11px}.seg.mini button{height:30px;font-size:12.5px;border-radius:8px;padding:0 10px}
.stepper{display:flex;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:14px;height:50px}
.stepper button{width:40px;height:100%;font-size:22px;color:var(--mut);text-align:center;flex:none}
.stepper input{width:100%;min-width:0;background:none;border:0;text-align:center;font-weight:800;outline:none;font-family:ui-rounded,-apple-system,system-ui}
/* hoy */
.rings{display:flex;align-items:center;gap:18px}
.rings svg{flex:none}
.ring{transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
.rleg{flex:1;display:flex;flex-direction:column;gap:12px}
.rl{display:flex;align-items:center;gap:10px}
.rl i{width:9px;height:9px;border-radius:9px;flex:none}
.rl b{font-size:21px;font-weight:800;display:block;line-height:1.05}
.rl b span{color:var(--mut);font-size:14px;font-weight:700}
.rl small{color:var(--mut);font-size:12.5px;font-weight:600}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.dd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--dim)}
.dd i{width:30px;height:30px;border-radius:30px;background:var(--card2);display:grid;place-items:center;color:var(--ink)}
.dd.on i{background:var(--acc)}
.dd.td span{color:var(--tx)}.dd.td i{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--tx)}
.banner{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,rgba(255,138,76,.16),rgba(255,138,76,.05));border:1px solid rgba(255,138,76,.28);border-radius:var(--r);padding:16px;margin-bottom:14px}
.banner .ic{width:44px;height:44px;border-radius:14px;background:rgba(255,138,76,.2);color:var(--c3);display:grid;place-items:center;flex:none}
.wrow{display:flex;align-items:center;gap:14px;width:100%;padding:12px 0;border-top:1px solid var(--line)}
.wrow:first-child{border-top:0;padding-top:2px}
.wdate{width:46px;height:50px;border-radius:14px;background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.wdate b{font-size:19px;line-height:1;font-weight:800}.wdate span{font-size:10.5px;color:var(--mut);font-weight:700;text-transform:uppercase;margin-top:2px}
.wmain{flex:1;min-width:0}.wname{font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;padding:26px 10px;color:var(--mut)}
.empty b{display:block;color:var(--tx);font-size:16px;margin-bottom:4px}
/* workout */
.wkh{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.wkh .tt{flex:1}
.wkh .el{font-size:28px;font-weight:800;line-height:1}
.exc{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.exn{font-weight:800;font-size:17px;letter-spacing:-.02em}
.sug{background:rgba(212,255,58,.06);border:1px solid rgba(212,255,58,.17);border-radius:14px;padding:11px 13px;margin:12px 0 4px}
.sug .rg{font-size:16px;font-weight:800;color:var(--acc)}
.sug .src{font-size:11.5px;color:var(--mut);font-weight:600;margin-top:1px}
.sug .tip{font-size:13px;margin-top:7px;color:var(--tx)}
.sug.none{background:var(--card2);border-color:var(--line)}
.lastl{font-size:12.5px;color:var(--mut);margin:8px 2px 0}
.setrow{display:flex;align-items:center;gap:10px;padding:10px 2px;border-top:1px solid var(--line)}
.setrow .n{width:24px;height:24px;border-radius:8px;background:var(--card2);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--mut);flex:none}
.setrow .v{flex:1;font-size:16px}.setrow .v b{font-weight:800}.setrow .v span{color:var(--mut);font-size:13px}
.sets{margin-top:10px}
.adder{display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:8px;margin-top:12px}
.adder .inp{text-align:center;font-weight:800;height:50px;font-family:ui-rounded,-apple-system,system-ui;font-size:18px;padding:0 6px}
.adder .lbl{text-align:center;margin:0 0 5px}
.prtag{font-size:10.5px;font-weight:800;color:var(--gold);background:rgba(255,214,10,.13);padding:2px 7px;border-radius:6px;margin-left:6px;vertical-align:2px}
.wkfoot{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(var(--sb) + 12px);background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:2}
.wkfoot .in{max-width:540px;margin:0 auto;display:flex;gap:10px}
/* picker */
.pkrow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 2px;border-top:1px solid var(--line)}
.pkg{font-size:11.5px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.07em;margin:18px 2px 4px}
.pkrow .dotm{width:8px;height:8px;border-radius:8px;background:var(--dim);flex:none}
.pkrow.in .dotm{background:var(--acc)}
.search{position:sticky;top:-10px;background:#0E0E10;padding:4px 0 8px;z-index:2}
/* progreso */
.hm-m{display:grid;font-size:10.5px;color:var(--mut);font-weight:700;margin-bottom:6px;height:14px}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3.5px}
.hm i{display:block;aspect-ratio:1;border-radius:3.5px;background:var(--card2)}
.hm i.l1{background:#4A5626}.hm i.l2{background:#7D9530}.hm i.l3{background:#ADD035}.hm i.l4{background:var(--acc)}
.hm i.tdy{box-shadow:0 0 0 1.5px var(--tx)}
.hm i.fut{background:transparent}
.hml{display:flex;align-items:center;gap:4px;justify-content:flex-end;margin-top:10px;font-size:11px;color:var(--mut)}
.hml i{width:11px;height:11px;border-radius:3px;display:block}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.st{background:var(--card2);border-radius:14px;padding:11px 12px}
.st b{display:block;font-size:22px;font-weight:800;line-height:1.1}.st span{font-size:11.5px;color:var(--mut);font-weight:600}
.bodies{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:4px 0 6px}
.bodies figure{margin:0;text-align:center}
.bodies svg{width:100%;max-width:170px;height:auto}
.bodies figcaption{font-size:11px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.07em}
.mleg{display:flex;justify-content:center;gap:12px;font-size:11px;color:var(--mut);margin:8px 0 14px;flex-wrap:wrap}
.mleg span{display:flex;align-items:center;gap:5px}.mleg i{width:10px;height:10px;border-radius:3px;display:block}
.mlist{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.mli{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:5px 0}
.mli .bar{flex:1;height:5px;border-radius:5px;background:var(--card2);overflow:hidden}.mli .bar i{display:block;height:100%;background:var(--acc);border-radius:5px}
.mli .nm{width:78px;color:var(--mut);font-weight:600;font-size:12.5px}.mli b{width:28px;text-align:right;font-size:13px}
.chips{display:flex;gap:7px;overflow-x:auto;margin:0 -18px 14px;padding:0 18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 13px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:13.5px;font-weight:700;color:var(--mut)}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.chart svg{width:100%;height:auto;display:block}
.bars{display:flex;align-items:flex-end;gap:7px;height:120px;position:relative;margin-top:6px}
.bars .bc{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.bars .bc i{display:block;width:100%;border-radius:7px 7px 3px 3px;background:#34343A;min-height:3px}
.bars .bc.cur i{background:var(--acc)}
.bars .bc span{font-size:10px;color:var(--mut);font-weight:700}
.bars .bc em{font-style:normal;font-size:10.5px;font-weight:800;color:var(--mut)}
.goalln{position:absolute;left:0;right:0;border-top:1.5px dashed rgba(255,255,255,.22)}
/* fotos */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pth{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--card2);display:block;width:100%}
.pth img{width:100%;height:100%;object-fit:cover;display:block}
.pth span{position:absolute;left:6px;bottom:6px;font-size:10.5px;font-weight:800;background:rgba(0,0,0,.55);padding:2px 6px;border-radius:6px;color:#fff}
.pth.sel{box-shadow:0 0 0 2.5px var(--acc)}
.cmp{position:relative;aspect-ratio:3/4;border-radius:18px;overflow:hidden;background:var(--card2);touch-action:pan-y;cursor:ew-resize}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
.cmp .a{position:absolute;inset:0;clip-path:inset(0 50% 0 0)}
.cmp .ln{position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:#fff;pointer-events:none}
.cmp .ln::after{content:"";position:absolute;top:50%;left:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:40px;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.cmp .tg{position:absolute;top:10px;font-size:11.5px;font-weight:800;background:rgba(0,0,0,.6);padding:4px 9px;border-radius:8px;pointer-events:none;color:#fff}
.bigph{width:100%;border-radius:18px;display:block;max-height:62vh;object-fit:contain;background:var(--card2)}
.upl{position:relative;overflow:hidden}
.upl input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
/* rutina */
.phrase{font-size:15px;color:var(--mut);margin:-8px 2px 18px;font-weight:600;line-height:1.35}
.phrase b{color:var(--tx)}
.today{background:linear-gradient(160deg,rgba(212,255,58,.13),rgba(212,255,58,.02) 60%);border:1px solid rgba(212,255,58,.25);border-radius:var(--r);padding:18px;margin-bottom:14px}
.today .nm{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:4px 0 12px}
.tchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.tchip{font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:9px;background:rgba(255,255,255,.07);color:var(--tx)}
.rday{display:flex;align-items:center;gap:14px;width:100%;padding:13px 0;border-top:1px solid var(--line)}
.rday:first-child{border-top:0;padding-top:2px}
.rday .dn{width:44px;height:44px;border-radius:14px;background:var(--card2);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none;color:var(--mut)}
.rday.on .dn{background:var(--acc);color:var(--ink)}
.rday.off .rn{color:var(--dim)}
.rex{display:flex;align-items:center;gap:8px;padding:11px 0;border-top:1px solid var(--line)}
.rex .ix{width:24px;height:24px;border-radius:8px;background:var(--card2);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--mut);flex:none}
.tpl{display:block;width:100%;text-align:left;padding:14px;border-radius:16px;background:var(--card2);border:1px solid var(--line);margin-bottom:8px}
.steps{margin:10px 0 0;padding-left:20px;font-size:13.5px;line-height:1.55;color:var(--mut)}
.steps b{color:var(--tx)}
/* música */
.mb,.mb-empty{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px;width:100%}
.mb-empty{padding:12px 14px;gap:10px;color:var(--mut);font-size:13.5px;font-weight:600}
.mb-empty svg{color:#1ED760;flex:none}
.mb-i{display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-align:left}
.mb-i img,.mb-i>svg{width:40px;height:40px;border-radius:9px;flex:none;object-fit:cover}
.mb-i>svg{padding:10px;background:var(--card2);color:#1ED760}
.mb-t{min-width:0;display:flex;flex-direction:column}.mb-t b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mb-t span{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mb-c{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--tx);flex:none}
.mb-p{background:var(--tx);color:var(--bg);border-radius:40px}
.mus-now{display:flex;align-items:center;gap:14px}
.mus-art{width:72px;height:72px;border-radius:14px;background:var(--card2);display:grid;place-items:center;color:#1ED760;flex:none;overflow:hidden}.mus-art img{width:100%;height:100%;object-fit:cover}
.mus-ctl{display:flex;justify-content:center;align-items:center;gap:22px;margin-top:16px}
.mus-ctl button{width:46px;height:46px;border-radius:40px;display:grid;place-items:center;background:var(--card2)}
.mus-ctl .pp{width:60px;height:60px;background:var(--tx);color:var(--bg)}
.mus-th{width:44px;height:44px;border-radius:9px;background:var(--card2);display:grid;place-items:center;color:#1ED760;flex:none;overflow:hidden}.mus-th img{width:100%;height:100%;object-fit:cover}
code.uri{display:block;font-size:12px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:6px;color:var(--tx);word-break:break-all;-webkit-user-select:all;user-select:all}
/* cazamonstruos */
.hcard{display:flex;gap:14px;align-items:center;background:linear-gradient(150deg,#1a1426,var(--card) 70%)}
.hc-m{width:92px;height:92px;flex:none}.hc-m svg{width:100%;height:100%}
#hunt{position:fixed;inset:0;z-index:80;background:var(--bg);display:none;flex-direction:column}
#hunt.on{display:flex}
.hh{display:flex;align-items:center;gap:12px;padding:calc(var(--st) + 10px) 16px 8px;max-width:540px;width:100%;margin:0 auto}
.hreps{text-align:right}.hreps b{display:block;font-size:30px;font-weight:900;line-height:1;color:var(--acc)}.hreps span{font-size:11px;color:var(--mut);font-weight:700}
.hscroll{flex:1;overflow:auto;padding:6px 16px 20px;max-width:540px;width:100%;margin:0 auto;-webkit-overflow-scrolling:touch}
.hfoot{padding:10px 16px calc(var(--sb) + 12px);max-width:540px;width:100%;margin:0 auto;gap:10px}

.bst.lock svg{filter:brightness(0) opacity(.35)}
.hpbar{position:relative;height:22px;border-radius:12px;background:var(--card2);margin:4px 16px 0;overflow:hidden;max-width:508px;align-self:stretch}

.hpbar i{position:absolute;left:0;top:0;bottom:0;border-radius:12px;transition:width .25s,background .3s}

.bob{animation:bob 2.4s ease-in-out infinite}

.spawn{animation:spawn .45s cubic-bezier(.2,1.4,.4,1),bob 2.4s ease-in-out .45s infinite}
@keyframes spawn{from{transform:scale(.2);opacity:0}}
.hit{animation:hit .28s}
@keyframes hit{0%{transform:translateX(0);filter:brightness(2.4)}25%{transform:translateX(-10px) rotate(-3deg)}50%{transform:translateX(9px) rotate(3deg)}100%{transform:none;filter:none}}
.dead{animation:dead .8s forwards}

#hFx{position:absolute;inset:0;pointer-events:none}
.dmg{position:absolute;top:38%;font-size:34px;font-weight:900;color:#fff;text-shadow:0 2px 0 var(--red),0 4px 12px rgba(0,0,0,.6);animation:dmg .8s ease-out forwards}

.camw video,.camw canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.camw video{transform:scaleX(-1)}
.hstat{font-size:13.5px;font-weight:700;color:var(--mut);min-height:36px}
.kgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}.kgrid svg{width:100%;height:auto}
/* entreno */
.enhead{display:flex;align-items:center;gap:10px;margin:2px 2px 12px}
.enchips{margin:0 -16px 12px;padding:0 16px}
.encard{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;margin-bottom:12px}
.ensug{font-size:13px;color:var(--mut);background:var(--card2);border-radius:12px;padding:9px 12px;margin:12px 0 0;line-height:1.4}

<script>
'use strict';
/* ============ utilidades ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(n,d=0)=>Number(n||0).toLocaleString('es-ES',{maximumFractionDigits:d});
const kgf=n=>fmt(n,2);
const kgR=k=>k[0]===k[1]?kgf(k[0]):kgf(k[0])+'–'+kgf(k[1]);
const pnum=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isFinite(n)?n:null};
const uid=p=>p+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pad=n=>String(n).padStart(2,'0');
const dkey=(d=new Date())=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const weekStart=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const daysBetween=(a,b)=>Math.round((parseD(dkey(b))-parseD(dkey(a)))/864e5);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const clone=o=>JSON.parse(JSON.stringify(o));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const norm=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIA=['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];
const fdate=k=>{const d=parseD(k);return d.getDate()+' '+MES[d.getMonth()]};
const fmtDur=s=>{s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}:${pad(m)}:${pad(x)}`:`${m}:${pad(x)}`};
const val=k=>{const el=document.querySelector(`[data-k="${k}"]`);return el?el.value:''};
const setVal=(k,v)=>{const el=document.querySelector(`[data-k="${k}"]`);if(el)el.value=v};
let toastT;function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),2300)}

const ICON={
hoy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/></svg>',

flame:'<svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><path d="M12 2c1 3.5 5 5.8 5 11a5 5 0 0 1-10 0c0-2.6 1.3-4.2 2.6-5.4.2 1.7 1 2.9 2.2 3.4C11 8.6 11.3 5 12 2z"/></svg>',

up:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>',
trash:'<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13"/></svg>'
};

/* ============ ejercicios ============ */
const MUSCLES={pecho:'Pecho',espalda:'Espalda',trapecio:'Trapecio',hombros:'Hombros',biceps:'Bíceps',triceps:'Tríceps',antebrazo:'Antebrazo',abdomen:'Abdomen',cuadriceps:'Cuádriceps',isquios:'Isquios',gluteos:'Glúteos',gemelos:'Gemelos'};
const KIND={bar:'Barra',db:'Mancuerna',mach:'Máquina',cable:'Polea',bw:'Peso corporal'};
// [id, nombre, tipo, principales, secundarios, ratio 1RM/peso (intermedio, hombre) | rangos reps peso corporal, rango reps, tren inferior]
const BASE=[
['bench','Press banca','bar',['pecho'],['triceps','hombros'],1.0,[6,10]],
['incdb','Press inclinado mancuernas','db',['pecho'],['hombros','triceps'],.32,[8,12]],
['chestpress','Press pecho máquina','mach',['pecho'],['triceps'],.9,[8,12]],
['fly','Aperturas en polea','cable',['pecho'],[],.25,[10,15]],
['dips','Fondos','bw',['pecho','triceps'],['hombros'],[[3,6],[6,12],[12,20]]],
['pushup','Flexiones','bw',['pecho'],['triceps','hombros'],[[6,12],[15,25],[25,40]]],
['pullup','Dominadas','bw',['espalda'],['biceps','antebrazo'],[[2,5],[6,10],[10,15]]],
['pulldown','Jalón al pecho','cable',['espalda'],['biceps'],.8,[8,12]],
['row','Remo con barra','bar',['espalda'],['biceps','trapecio'],.85,[6,10]],
['cablerow','Remo en polea','cable',['espalda'],['biceps','trapecio'],.8,[8,12]],
['dbrow','Remo con mancuerna','db',['espalda'],['biceps'],.4,[8,12]],
['ohp','Press militar','bar',['hombros'],['triceps'],.62,[6,10]],
['dbohp','Press hombro mancuernas','db',['hombros'],['triceps'],.26,[8,12]],
['lateral','Elevaciones laterales','db',['hombros'],[],.11,[12,20]],
['facepull','Face pull','cable',['hombros'],['trapecio'],.32,[12,20]],
['shrug','Encogimientos','db',['trapecio'],['antebrazo'],.5,[10,15]],
['curl','Curl con barra','bar',['biceps'],['antebrazo'],.45,[8,12]],
['dbcurl','Curl mancuernas','db',['biceps'],['antebrazo'],.18,[8,12]],
['hammer','Curl martillo','db',['biceps','antebrazo'],[],.2,[8,12]],
['skull','Press francés','bar',['triceps'],[],.38,[8,12]],
['pushdown','Extensión tríceps polea','cable',['triceps'],[],.45,[10,15]],
['squat','Sentadilla','bar',['cuadriceps','gluteos'],['isquios','abdomen'],1.35,[5,8],1],
['legpress','Prensa','mach',['cuadriceps','gluteos'],[],2.4,[8,12],1],
['lunge','Zancadas mancuernas','db',['cuadriceps','gluteos'],['isquios'],.25,[8,12],1],
['legext','Extensión cuádriceps','mach',['cuadriceps'],[],.75,[10,15],1],
['dl','Peso muerto','bar',['isquios','gluteos','espalda'],['trapecio','antebrazo'],1.65,[3,6],1],
['rdl','Peso muerto rumano','bar',['isquios','gluteos'],['espalda'],1.1,[6,10],1],
['legcurl','Curl femoral','mach',['isquios'],[],.55,[10,15],1],
['hipthrust','Hip thrust','bar',['gluteos'],['isquios'],1.5,[8,12],1],
['calf','Elevación de gemelos','mach',['gemelos'],[],1.2,[10,15],1],
['crunch','Crunch en polea','cable',['abdomen'],[],.6,[10,15]],
['legraise','Elevación de piernas','bw',['abdomen'],[],[[6,10],[10,15],[15,20]]],
['abwheel','Rueda abdominal','bw',['abdomen'],[],[[4,8],[8,12],[12,20]]]
];
const EXB=BASE.map(([id,n,k,m,s,r,rep,lo])=>k==='bw'?{id,n,k,m,s,bwr:r,lo:false}:{id,n,k,m,s,r,rep,lo:!!lo});
const allEx=()=>EXB.concat((S.profile&&S.profile.custom)||[]);
const exById=id=>allEx().find(e=>e.id===id)||{id,n:'Ejercicio borrado',k:'mach',m:[],s:[],rep:[8,12]};
const stepOf=ex=>ex.k==='bar'?(ex.lo?5:2.5):ex.k==='db'?2:ex.k==='mach'?5:2.5;
const roundTo=(v,s)=>Math.round(v/s)*s;
const epley=(kg,r)=>r<=1?kg:kg*(1+r/30);

/* ============ estado ============ */
const S={tab:'hoy',ready:false,profile:null,draft:null,workouts:[],photos:[],sheets:[],pick:null,prEx:null,mapRange:'w',histN:10,cmp:[null,null],loadNote:null};
try{S.tab=localStorage.getItem('forja.tab')||'hoy'}catch(e){}

/* ============ almacenamiento (IndexedDB en el iPhone) ============ */
const DBN='forja',OS='kv';
const Store={mode:'local',db:null,items:{},
  open(){return new Promise((res,rej)=>{const r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>r.result.createObjectStore(OS);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  tx(mode,fn){return new Promise((res,rej)=>{const t=this.db.transaction(OS,mode),st=t.objectStore(OS);const out=fn(st);t.oncomplete=()=>res(out&&out.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
  async init(){
    try{
      this.db=await this.open();
      const keys=await this.tx('readonly',st=>st.getAllKeys()),vals=await this.tx('readonly',st=>st.getAll());
      const it={};keys.forEach((k,i)=>it[k]=vals[i]);this.items=it;
      // migración desde la versión anterior (localStorage)
      if(!Object.keys(it).length){try{const old=JSON.parse(localStorage.getItem('forja.v1')||'{}').items;if(old){for(const[k,v]of Object.entries(old))await this.put(k,v)}}catch(e){}}
    }catch(e){this.db=null;try{this.items=(JSON.parse(localStorage.getItem('forja.v1')||'{}').items)||{}}catch(e2){this.items={}}}
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
    S.ready=true;onData();
  },
  err(){toast('No se pudo guardar en el iPhone')},
  put(id,data){this.items[id]=data;
    if(!this.db){try{localStorage.setItem('forja.v1',JSON.stringify({items:this.items}))}catch(e){this.err()}return Promise.resolve()}
    const body=clone(data);return this.tx('readwrite',st=>st.put(body,id)).catch(()=>this.err())},
  putDraft(d){return this.put('draft',d)},
  del(id){delete this.items[id];
    if(!this.db){try{localStorage.setItem('forja.v1',JSON.stringify({items:this.items}))}catch(e){}return Promise.resolve()}
    return this.tx('readwrite',st=>st.delete(id)).catch(()=>this.err())}
};
function sig(items){return JSON.stringify(Object.keys(items).sort().map(k=>[k,items[k]]))}
function onData(){derive();render()}
function derive(){
  const it=Store.items;S.profile=it.profile||null;S.draft=it.draft||null;
  const ws=[],ps=[],hs=[];
  for(const[id,v]of Object.entries(it)){if(!v)continue;if(v.t==='w')ws.push(Object.assign({},v,{id}));else if(v.t==='p')ps.push(Object.assign({},v,{id}));else if(v.t==='h')hs.push(Object.assign({},v,{id}))}
  S.hunts=hs;
  const by=(a,b)=>a.d<b.d?-1:a.d>b.d?1:(a.ts||0)-(b.ts||0);
  S.workouts=ws.sort(by);S.photos=ps.sort(by);
}

/* ============ cálculos ============ */
const latestBW=p=>{const b=(p&&p.bw)||[];return b.length?b[b.length-1].kg:null};
function wSum(w){let sets=0,vol=0;(w.ex||[]).forEach(e=>(e.sets||[]).forEach(s=>{sets++;vol+=(s.kg||0)*(s.reps||0)}));return{sets,vol,n:(w.ex||[]).length}}
function wName(w){
  if(w.name)return w.name;const c={};
  (w.ex||[]).forEach(e=>{const ex=exById(e.id);ex.m.forEach(m=>c[m]=(c[m]||0)+(e.sets||[]).length)});
  return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,2).map(x=>MUSCLES[x[0]]).join(' · ')||'Entreno';
}
function weekStats(off){
  const ws=addDays(weekStart(new Date()),-7*off),a=dkey(ws),b=dkey(addDays(ws,7));
  let sets=0,vol=0;const days=new Set();

  if(!p||typeof ex.r!=='number')return null;

  const male=p.sex!=='f',ref=male?80:62,h=(p.height||175)/100;

  const a=Math.max(minW,roundTo(w(rhi),step)),b=Math.max(minW,roundTo(w(rlo),step));
  let tip=null,target=null;
  if(last){
    const top=Math.max(...last.sets.map(s=>s.kg||0)),ts=last.sets.filter(s=>(s.kg||0)===top);
    if(ts.every(s=>s.reps>=rhi)){target=top+step;tip=`Has llegado a ${rhi} reps: sube a ${kgf(target)} kg`}

}

function vProg(){
  const p=S.profile;
  // heatmap
  const W=18,start=addDays(weekStart(new Date()),-7*(W-1)),today=dkey(),per={};
  S.workouts.forEach(w=>{per[w.d]=(per[w.d]||0)+wSum(w).sets});
  let cells='',months='';let pm=-1;
  for(let c=0;c<W;c++){const m=addDays(start,7*c).getMonth();if(m!==pm){months+=`<span style="grid-column:${c+1}/span 3">${MES[m]}</span>`;pm=m}}
  for(let i=0;i<W*7;i++){const k=dkey(addDays(start,i)),v=per[k]||0,l=v===0?0:v<10?1:v<18?2:v<26?3:4;cells+=`<i class="${l?'l'+l:''} ${k===today?'tdy':''} ${k>today?'fut':''}"></i>`}
  const mStart=dkey(new Date(new Date().getFullYear(),new Date().getMonth(),1));
  const thisMonth=new Set(S.workouts.filter(w=>w.d>=mStart).map(w=>w.d)).size;
  const totalDays=new Set(S.workouts.map(w=>w.d)).size;
  // barras semanales
  const wk=[];for(let i=7;i>=0;i--)wk.push(weekStats(i));
  const sg=p.setsGoal||60,mx=Math.max(sg*1.1,...wk.map(x=>x.sets),1);
  const bars=wk.map((x,i)=>`<div class="bc ${i===7?'cur':''}"><em class="num">${x.sets||''}</em><i style="height:${(x.sets/mx*78).toFixed(1)}%"></i><span>${x.start.getDate()}/${x.start.getMonth()+1}</span></div>`).join('');
  // mapa muscular
  const mc=muscleSets(S.mapRange),mmax=Math.max(12,...Object.values(mc));
  const ml=Object.keys(MUSCLES).sort((a,b)=>mc[b]-mc[a]).map(k=>`<div class="mli"><span class="nm">${MUSCLES[k]}</span><div class="bar"><i style="width:${(mc[k]/mmax*100).toFixed(0)}%;background:${MCOL[Math.max(1,mlevel(mc[k]))]}"></i></div><b class="num">${fmt(mc[k],1)}</b></div>`).join('');
  // ejercicio
  const cnt={};S.workouts.forEach(w=>(w.ex||[]).forEach(e=>{if(e.sets&&e.sets.length)cnt[e.id]=(cnt[e.id]||0)+1}));
  const exIds=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]);
  if(!S.prEx||!cnt[S.prEx])S.prEx=exIds[0]||null;
  let exCard='';
  if(S.prEx){
    const ex=exById(S.prEx),hs=sessionsOf(S.prEx);let best=-1,heavy=null;
    const pts=hs.map(h=>{const y=sessE1(ex,h.sets),pr=y>best&&best>=0;if(y>best)best=y;h.sets.forEach(s=>{if(!heavy||s.kg>heavy.kg||(s.kg===heavy.kg&&s.reps>heavy.reps))heavy=s});return{x:parseD(h.d).getTime(),y,pr}});
    const first=pts[0].y,lastv=pts[pts.length-1].y,ch=first?((lastv-first)/first*100):0;
    const sg2=suggest(ex),bw=ex.k==='bw';
    exCard=`<div class="card"><div class="ch"><span class="ct">Progreso por ejercicio</span><span class="pill gold">● PR</span></div>
    <div class="chips">${exIds.map(id=>`<button class="chip ${id===S.prEx?'on':''}" data-act="pr-ex" data-id="${id}">${esc(exById(id).n)}</button>`).join('')}</div>
    <div style="margin:-2px 0 14px">${rankBlock(ex,rankOf(ex,best),heavy&&heavy.reps)}</div>
    <div class="row" style="align-items:flex-end;margin-bottom:6px"><div class="sp"><div class="num" style="font-size:30px;font-weight:800;line-height:1">${fmt(lastv,bw?0:1)}<span class="mut" style="font-size:15px"> ${bw?'reps':'kg'}</span></div><div class="sm mut">${bw?'Máx. reps en una serie':'1RM estimado (última sesión)'}</div></div>${pts.length>1?`<span class="pill ${ch>=0?'acc':''}">${ch>=0?'+':''}${fmt(ch,1)} %</span>`:''}</div>
    <div class="chart">${lineChart(pts,{unit:bw?'':'kg',dec:bw?0:1})}</div>
    <div class="stats3"><div class="st"><b class="num">${fmt(best,bw?0:1)}</b><span>${bw?'Récord reps':'Mejor 1RM est.'}</span></div><div class="st"><b class="num">${bw?(heavy?heavy.reps:0):kgf(heavy?heavy.kg:0)}</b><span>${bw?'Mejor serie':'Más peso (kg)'}</span></div><div class="st"><b class="num">${hs.length}</b><span>Sesiones</span></div></div>
    ${sg2.kg?`<p class="note" style="margin:12px 2px 0">Rango actual: <b style="color:var(--tx)">${kgR(sg2.kg)} kg × ${sg2.reps[0]}–${sg2.reps[1]}</b>${sg2.tip?' · '+esc(sg2.tip):''}</p>`:sg2.bw?`<p class="note" style="margin:12px 2px 0">Rango: <b style="color:var(--tx)">${sg2.reps[0]}–${sg2.reps[1]} reps</b>${sg2.tip?' · '+esc(sg2.tip):''}</p>`:''}</div>`;
  }
  // peso corporal
  const bwp=(p.bw||[]).map(b=>({x:parseD(b.d).getTime(),y:b.kg}));
  const all=S.workouts.slice().reverse(),hist=all.slice(0,S.histN);
  return`<div class="top"><div><div class="eyebrow">Tu evolución</div><h1>Progreso</h1></div></div>
  <div class="card"><div class="ch"><span class="ct">Constancia</span><span class="sm mut">18 semanas</span></div>
   <div class="hm-m" style="grid-template-columns:repeat(${W},1fr)">${months}</div>
   <div class="hm" style="grid-template-columns:repeat(${W},1fr)">${cells}</div>
   <div class="hml">Menos<i style="background:var(--card2)"></i><i style="background:#4A5626"></i><i style="background:#7D9530"></i><i style="background:#ADD035"></i><i style="background:var(--acc)"></i>Más</div>
   <div class="stats3"><div class="st"><b class="num">${totalDays}</b><span>Días entrenados</span></div><div class="st"><b class="num">${thisMonth}</b><span>Este mes</span></div><div class="st"><b class="num">${weekStreak()}</b><span>Semanas en racha</span></div></div></div>
  <div class="card"><div class="ch"><span class="ct">Mapa muscular</span>${seg('mr',S.mapRange,[['w','Semana'],['m','4 sem']],true)}</div>
   <div class="bodies"><figure>${bodySVG(FRONT,mc)}<figcaption>Frontal</figcaption></figure><figure>${bodySVG(BACK,mc)}<figcaption>Posterior</figcaption></figure></div>
   <div class="mleg"><span><i style="background:${MCOL[0]}"></i>0</span><span><i style="background:${MCOL[1]}"></i>1–4</span><span><i style="background:${MCOL[2]}"></i>5–9</span><span><i style="background:${MCOL[3]}"></i>10+ series/sem</span></div>
   <div class="mlist">${ml}</div></div>
  <div class="card"><div class="ch"><span class="ct">Series por semana</span><span class="sm mut">Objetivo ${sg}</span></div>
   <div class="bars"><div class="goalln" style="bottom:calc(${(sg/mx*78).toFixed(1)}% + 19px)"></div>${bars}</div></div>
  ${rankCard(exIds)}
  ${exCard}
  <div class="card"><div class="ch"><span class="ct">Peso corporal</span><button class="btn s sec" data-act="bw-open">${ICON.plus} Registrar</button></div>
   ${bwp.length?`<div class="row" style="margin-bottom:4px"><div class="num" style="font-size:30px;font-weight:800">${kgf(bwp[bwp.length-1].y)}<span class="mut" style="font-size:15px"> kg</span></div><span class="sp"></span>${bwp.length>1?`<span class="pill">${bwp[bwp.length-1].y-bwp[0].y>=0?'+':''}${kgf(Math.round((bwp[bwp.length-1].y-bwp[0].y)*10)/10)} kg desde el inicio</span>`:''}</div><div class="chart">${lineChart(bwp,{unit:'kg',color:'var(--c2)',h:130})}</div>`:''}</div>
  <div class="card"><div class="ch"><span class="ct">Historial</span><span class="sm mut">${all.length} entrenos</span></div>
   ${hist.length?hist.map(wRow).join(''):`<div class="empty"><b>Sin entrenos todavía</b>Tu historial aparecerá aquí.</div>`}
   ${all.length>S.histN?`<button class="btn ghost" data-act="hist-more">Ver más</button>`:''}</div>`;
}

function rankCard(ids){
  const L=ids.map(id=>{const ex=exById(id);return{ex,rk:rankOf(ex,bestVal(ex))}}).filter(x=>x.rk).sort((a,b)=>b.rk.score-a.rk.score);
  if(!L.length)return'';
  return`<div class="card"><div class="ch"><span class="ct">Tus rangos</span><span class="sm mut">${L.length} ejercicio${L.length===1?'':'s'}</span></div><div class="rkgrid">${L.map(({ex,rk})=>`<button class="rkc" data-act="pr-ex" data-id="${ex.id}">${rankBadge(rk,40)}<b style="color:${rk.col}">${rankLabel(rk)}</b><span>${esc(ex.n)}</span></button>`).join('')}</div></div>`;
}

  'wd-del'(el){const id=el.dataset.id;confirmSheet('¿Borrar entreno?','No se puede deshacer.','Borrar',true,()=>{Store.del(id);derive();S.sheets=[];render();toast('Entreno borrado')})},
  'cf-ok'(){const s=S.sheets[S.sheets.length-1];S.sheets.pop();if(s&&s.fn)s.fn();else render()},
  'pr-ex'(el){S.prEx=el.dataset.id;render()},
  'hist-more'(){S.histN+=15;render()},
  'bw-open'(){openSheet({type:'bw'})},
  'bw-save'(){const kg=pnum(val('bw.kg'));if(!kg||kg<30||kg>250)return toast('Pon un peso válido');
    const p=clone(S.profile),t=dkey();p.bw=(p.bw||[]).filter(b=>b.d!==t).concat([{d:t,kg}]).sort((a,b)=>a.d<b.d?-1:1).slice(-500);
    Store.put('profile',p);derive();closeTop();toast('Peso guardado')},
  'pf-save'(){const p=clone(S.profile),h=parseInt(val('pf.h'));if(!h||h<120||h>230)return toast('Revisa la altura');
    Object.assign(p,{name:val('pf.name').trim(),sex:val('pf.sex'),height:h,level:val('pf.lvl'),goal:clamp(parseInt(val('pf.goal'))||4,1,7),setsGoal:clamp(parseInt(val('pf.sg'))||60,10,200),photoEvery:clamp(parseInt(val('pf.ph'))||14,1,60)});
    Store.put('profile',p);derive();render();toast('Guardado')},
  'cu-open'(){openSheet({type:'cu'})},
  'cu-save'(){const n=val('cu.n').trim();if(!n)return toast('Ponle nombre');let lo=parseInt(val('cu.lo'))||8,hi=parseInt(val('cu.hi'))||12;if(hi<lo)[lo,hi]=[hi,lo];
    const k=val('cu.k'),c={id:'c'+Date.now().toString(36),n,k,m:[val('cu.m')],s:[],rep:[lo,hi],lo:['cuadriceps','isquios','gluteos','gemelos'].includes(val('cu.m'))};
    if(k==='bw')c.bwr=[[Math.max(1,lo-3),lo],[lo,hi],[hi,hi+6]];
    const p=clone(S.profile);p.custom=(p.custom||[]).concat([c]);Store.put('profile',p);derive();
    S.sheets.pop();const pk=S.sheets.findIndex(s=>s.type==='pk');
    if(pk>=0&&S.pick){S.sheets.splice(pk,1);const i=S.pick.i;S.pick=null;const p2=clone(S.profile);p2.routine=clone(routineOf());p2.routine[i].ex.push(c.id);p2.routine[i].label=p2.routine[i].name||autoName(p2.routine[i].ex);Store.put('profile',p2);derive()}
    else if(pk>=0&&S.draft){S.sheets.splice(pk,1);const d=clone(S.draft);d.ex.push({id:c.id,uid:uid('e').replace(/-/g,''),sets:[]});Store.putDraft(d);derive()}
    render();toast('Ejercicio creado')},
  'cu-del'(el){const id=el.dataset.id;confirmSheet('¿Borrar ejercicio?','Los entrenos antiguos con este ejercicio se quedan, pero sin nombre.','Borrar',true,()=>{const p=clone(S.profile);p.custom=(p.custom||[]).filter(c=>c.id!==id);Store.put('profile',p);derive();render()})},
  'ph-open'(el){openSheet({type:'ph',id:el.dataset.id})},
  'ph-cmp'(el){S.cmp[+el.dataset.i]=el.dataset.id;S.cmpPos=50;closeTop()},
  'ph-del'(el){const id=el.dataset.id;confirmSheet('¿Borrar foto?','No se puede deshacer.','Borrar',true,()=>{Store.del(id);derive();S.sheets=[];render()})},
  'bk-open'(){openSheet({type:'bk'})},
  async 'bk-copy'(){const t=$('#bktxt').value;try{await navigator.clipboard.writeText(t);toast('Copiado')}catch(e){const el=$('#bktxt');el.removeAttribute('readonly');el.select();try{document.execCommand('copy');toast('Copiado')}catch(e2){toast('Mantén pulsado el texto para copiarlo')}el.setAttribute('readonly','')}},
  'bk-import'(){let j;try{j=JSON.parse(val('bk.in'))}catch(e){return toast('Ese texto no es una copia válida')}
    if(!j||j.app!=='forja'||!j.items)return toast('Ese texto no es una copia de Forja');
    const ents=Object.entries(j.items).filter(([k,v])=>v&&['w','p','h','profile'].includes(v.t)&&(v.t!=='p'||v.asset||v.src));
    confirmSheet('¿Restaurar copia?',`Se cargarán ${ents.length} registros. Los que tengan el mismo identificador se sobrescriben.`,'Restaurar',false,async()=>{
      S.sheets=[];render();toast('Restaurando…');for(const[k,v]of ents){await Store.put(k,v);await sleep(Store.mode==='cloud'?80:0)}derive();render();toast('Copia restaurada')})},
};
const C={
  'rd-name'(el){const i=+el.dataset.i,v=el.value.trim();saveRoutine(r=>{r[i].name=v})},
  'wk-name'(el){if(!S.draft)return;const d=clone(S.draft);d.name=el.value.trim();Store.putDraft(d);derive()},
  'wk-date'(el){if(!S.draft||!el.value)return;const d=clone(S.draft);d.d=el.value;Store.putDraft(d);derive()},
  async photo(el){const f=el.files&&el.files[0];el.value='';if(f)await addPhoto(f)}
};
const I={pk(el){const l=$('#pklist');if(l)l.innerHTML=pickerList(el.value)}};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=A[el.dataset.act];if(f){e.preventDefault();f(el,e)}});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset&&el.dataset.input&&I[el.dataset.input])I[el.dataset.input](el)});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset&&el.dataset.change&&C[el.dataset.change])C[el.dataset.change](el)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&/^a.+\.(kg|r)$/.test(e.target.dataset.k||'')){e.preventDefault();const u=e.target.dataset.k.slice(1).split('.')[0];const b=document.querySelector(`[data-act="set-add"][data-u="${u}"]`);if(b)b.click()}});
// comparador antes/después
let drag=null;
const setCmp=(c,x)=>{const r=c.getBoundingClientRect(),p=clamp((x-r.left)/r.width*100,0,100);c.querySelector('.a').style.clipPath=`inset(0 ${100-p}% 0 0)`;c.querySelector('.ln').style.left=p+'%';S.cmpPos=p};
document.addEventListener('pointerdown',e=>{const c=e.target.closest('.cmp');if(c){drag=c;setCmp(c,e.clientX)}});
document.addEventListener('pointermove',e=>{if(drag)setCmp(drag,e.clientX)});
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,()=>drag=null));

/* ============ fotos ============ */
async function compress(file,max,q){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');
    c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',q));return{blob,canvas:c};
  }finally{URL.revokeObjectURL(url)}
}
async function addPhoto(file){
  toast('Guardando foto…');
  try{
    const{canvas}=await compress(file,1200,.82);
    const doc={t:'p',d:dkey(),ts:Date.now(),kg:latestBW(S.profile)||null,src:canvas.toDataURL('image/jpeg',.82)};
    await Store.put(uid('p'),doc);derive();render();toast('Foto guardada');
  }catch(e){toast('No se pudo guardar la foto')}
}
